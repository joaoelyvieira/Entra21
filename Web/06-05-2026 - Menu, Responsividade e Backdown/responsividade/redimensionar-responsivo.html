<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Estilo base para dispositivos móveis */
body {
  background-color: olive;
  color: white;
}

/* Para dispositivos com largura mínima de 768px (Média) */
@media screen and (min-width: 768px) {
  body {
    background-color: blue;
    color: white;
  }
}

/* Para dispositivos com largura mínima de 992px (Grande) */
@media screen and (min-width: 992px) {
  body {
    background-color: tan;
    color: black;
  }
}
</style>
</head>
<body>

<h1>Redimensione a janela do navegador para ver o efeito!</h1>

</body>
</html>
