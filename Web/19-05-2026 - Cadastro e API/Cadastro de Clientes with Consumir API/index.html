<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="estilos/estilosindex.css">
</head>

<body>

    <div class="container">

        <div id="menu">
            <h1>Cadastro de Clientes</h1>
            <p class="descricao">O que você deseja fazer?</p>

            <button onclick="mostrarCadastro()">Cadastrar Cliente</button>
            <button onclick="mostrarLista()">Ver Clientes</button>
        </div>


        <div id="cadastro" class="tela escondido">
            <h2>Novo Cliente</h2>

            <div class="form-box">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Nome do cliente">

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="email@exemplo.com">

                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000">

                <label for="cep">CEP</label>
                <div class="cep-group">
                    <input type="text" id="cep" placeholder="00000-000" maxlength="9">
                    <button type="button" class="btn-cep" onclick="buscarLogradouro()">Buscar</button>
                </div>

                <label for="rua">Rua</label>
                <input type="text" id="rua" placeholder="Rua">

                <label for="numero">Número</label>
                <input type="text" id="numero" placeholder="Número">

                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" placeholder="Bairro">

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" placeholder="Cidade">

                <label for="estado">Estado</label>
                <input type="text" id="estado" placeholder="UF" maxlength="2">

                <p id="mensagem" class="escondido"></p>

                <button onclick="cadastrarCliente()">Cadastrar</button>
                <button class="btn-voltar" onclick="voltarMenu()">Voltar</button>
            </div>
        </div>


        <div id="lista" class="tela escondido">
            <h2>Clientes Cadastrados</h2>

            <div id="listaCards"></div>

            <button class="btn-voltar" onclick="voltarMenu()">Voltar</button>
        </div>

    </div>

    <script src="index.js"></script>

</body>

</html>
