<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Cards - Entra21</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container{
            display: flex;
            flex-wrap: wrap;
        }

        .card {
            width: 380px;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 5px 10px rgba(64, 1, 1, 0.3);
            cursor: pointer;
            margin:5px;
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: #e74c3c;
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;            
        }

        .card-content {
            padding: 12px 14px;
        }

        .card-source {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .card-source .icon {
            color: #e74c3c;
            margin-right: 6px;
        }

        .source-name {
            font-weight: bold;
            margin-right: 4px;
        }

        .time {
            color: #999;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            margin: 8px 0 12px;
            line-height: 1.3;
        }

        .card-actions {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <img src="https://img.band.com.br/image/2026/04/15/neymar-atacante-do-santos-10460.png"
                alt="Imagem" class="card-img">

            <div class="card-content">
                <div class="card-source">
                    <span class="icon">⚠️</span>
                    <span class="source-name">Teste Entra21</span>
                    <span class="time">• 1d</span>
                </div>

                <h2 class="card-title">
                    Neymar JR é convocado para a Copa do Mundo de 2026!
                </h2>

                <div class="card-actions">
                    <span>👍 365k</span>
                    <span>💬 39k</span>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://assets.goal.com/v3/assets/bltcc7a7ffd2fbf71f5/blt7833f4ee6312dc9e/638c40674668d7214ce80de6/Lionel_Messi_Australia_Argentina.jpg"
                alt="Imagem" class="card-img">

            <div class="card-content">
                <div class="card-source">
                    <span class="icon">⚠️</span>
                    <span class="source-name">Teste Entra21</span>
                    <span class="time">• 1d</span>
                </div>

                <h2 class="card-title">
                    A despedida de Lionel Messi da seleção argentina emociona fãs em todo o mundo!
                </h2>

                <div class="card-actions">
                    <span>👍 259k</span>
                    <span>💬 21k</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
